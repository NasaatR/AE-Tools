name: Package foundation preview
on:
  push:
    branches: [main]
    paths: ['installer/preview-version']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - name: Build and verify first preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content installer/preview-version).Trim()
          if ($version -ne '1.0') { throw 'This bootstrap signer is limited to the 1.0 foundation preview.' }
          gh release view v1.0 --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Version 1.0 already exists; issued bytes are immutable.' }
          $tool = "$env:RUNNER_TEMP/ZXPSignCmd.exe"
          Invoke-WebRequest 'https://raw.githubusercontent.com/Adobe-CEP/CEP-Resources/ab5e4e3e53a42fad08e1225a22a991bb1ffe73f6/ZXPSignCMD/4.1.3/x64/ZXPSignCmd.exe' -OutFile $tool
          if ((Get-FileHash $tool).Hash -ne 'FFC2223167225CE61D024EB463FC5AD1A1BE16133F99EF334A646F7311916C98') { throw 'Adobe signer hash mismatch.' }
          $env:AETOOLS_CERT_PASSWORD = [Guid]::NewGuid().ToString('N')
          Write-Output "::add-mask::$env:AETOOLS_CERT_PASSWORD"
          $cert = "$env:RUNNER_TEMP/foundation.p12"
          try {
            & $tool -selfSignedCert US Local 'AE Tools' 'AE Tools Foundation Preview 1.0' $env:AETOOLS_CERT_PASSWORD $cert
            if ($LASTEXITCODE -ne 0) { throw 'Preview certificate creation failed.' }
            $nsis = "${env:ProgramFiles(x86)}/NSIS/makensis.exe"
            if (!(Test-Path $nsis)) { choco install nsis --yes --no-progress }
            ./installer/package.ps1 -SignTool $tool -Certificate $cert -Nsis $nsis
          } finally { Remove-Item $cert -ErrorAction SilentlyContinue }
          $dir = "$env:APPDATA/Adobe/CEP/extensions/com.nasaat.aetools.panel"
          if (Test-Path $dir) { throw 'Runner unexpectedly contains an existing installation.' }
          foreach ($attempt in 1..2) {
            $proc = Start-Process 'build/AE-Tools-1.0-Setup.exe' -ArgumentList '/S' -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "Installation failed: $($proc.ExitCode)" }
            foreach ($f in Get-ChildItem 'build/signed' -Recurse -File) {
              $relative = [IO.Path]::GetRelativePath((Resolve-Path 'build/signed').Path,$f.FullName)
              if ((Get-FileHash $f.FullName).Hash -ne (Get-FileHash (Join-Path $dir $relative)).Hash) { throw "Installer changed $relative" }
            }
          }
          @('AE-Tools-1.0-Setup.exe','AE-Tools-1.0.zxp') | ForEach-Object { "$((Get-FileHash "build/$_").Hash.ToLower())  $_" } | Set-Content -Encoding ascii build/SHA256SUMS.txt
          gh release create v1.0 build/AE-Tools-1.0-Setup.exe build/AE-Tools-1.0.zxp build/SHA256SUMS.txt --target $env:GITHUB_SHA --prerelease --title 'AE Tools 1.0 · Foundation preview' --notes-file installer/NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
